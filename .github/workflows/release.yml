name: Release

# Tag-driven release. Every quality gate from CI runs again here — a tag can
# point at a commit that never went through a pull request.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # A tag that disagrees with the manifest produces a package the Web Store
      # will reject, or worse, silently ships the wrong version.
      - name: Check the tag matches the manifest version
        id: version
        run: |
          MANIFEST_VERSION=$(node -p "require('./public/manifest.json').version")
          echo "version=$MANIFEST_VERSION" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME declares $TAG_VERSION but the manifest says $MANIFEST_VERSION."
              exit 1
            fi
          fi
          echo "Releasing version $MANIFEST_VERSION"

      - name: Check the changelog has an entry for this version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' entry."
            exit 1
          fi

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # Production Firebase settings (repository variables), set on this step
      # only: real environment variables take priority over .env files, so
      # job-wide they would also leak into the emulator-backed e2e build. The
      # build fails, listing what is missing, if any are unset.
      - name: Build extension
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_STRIPE_PRICE_ID: ${{ vars.VITE_STRIPE_PRICE_ID }}
          VITE_FIREBASE_FUNCTIONS_REGION: ${{ vars.VITE_FIREBASE_FUNCTIONS_REGION }}

      # Strict: warnings such as an over-long store description block a release.
      - run: npm run validate:manifest -- --strict

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: xvfb-run --auto-servernum npm run test:e2e

      - name: Package
        run: npm run package

      - name: Record checksum and build info
        run: |
          sha256sum snap-ocr-*.zip | tee SHA256SUMS.txt
          {
            echo "version=${{ steps.version.outputs.version }}"
            echo "commit=$GITHUB_SHA"
          } | tee BUILD-INFO.txt

      - uses: actions/upload-artifact@v6
        with:
          name: snap-ocr-release-${{ steps.version.outputs.version }}
          path: |
            snap-ocr-*.zip
            SHA256SUMS.txt
            BUILD-INFO.txt
          retention-days: 90
          if-no-files-found: error

  upload:
    name: Upload draft to the Chrome Web Store
    runs-on: ubuntu-latest
    needs: verify
    # The protected environment provides the manual approval step (configure
    # required reviewers on it in the repository settings). Until the store
    # credentials are set as secrets, this job only logs a warning and the
    # release stops at a verified, downloadable artifact.
    environment: chrome-web-store
    if: github.event_name == 'push'
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: snap-ocr-release-${{ needs.verify.outputs.version }}

      - name: Verify the package checksum
        run: sha256sum --check SHA256SUMS.txt

      - name: Check that store credentials are configured
        id: creds
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          if [ -z "$EXTENSION_ID" ] || [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ] || [ -z "$REFRESH_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Chrome Web Store secrets are not set; skipping upload. The verified package is attached to this run."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Uploads a draft only. Publishing stays a deliberate step in the Chrome
      # Web Store dashboard, after the draft has been checked there.
      - name: Upload draft
        if: steps.creds.outputs.configured == 'true'
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          npx --yes chrome-webstore-upload-cli@3 upload \
            --source "snap-ocr-${{ needs.verify.outputs.version }}.zip" \
            --extension-id "$EXTENSION_ID" \
            --client-id "$CLIENT_ID" \
            --client-secret "$CLIENT_SECRET" \
            --refresh-token "$REFRESH_TOKEN"

      - name: Summarise outcome
        run: |
          if [ "${{ steps.creds.outputs.configured }}" = "true" ]; then
            echo "### Uploaded version ${{ needs.verify.outputs.version }} as a draft" >> "$GITHUB_STEP_SUMMARY"
            echo "Not published yet: submit it for review from the Chrome Web Store dashboard." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Built and verified version ${{ needs.verify.outputs.version }} — not uploaded" >> "$GITHUB_STEP_SUMMARY"
            echo "Store credentials are not configured. See docs/ci-cd.md." >> "$GITHUB_STEP_SUMMARY"
          fi
