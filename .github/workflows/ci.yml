name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs exactly the lockfile, so a build is reproducible and
      # a tampered lockfile fails rather than silently resolving something new.
      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build extension
        run: npm run build

      # A successful build does not prove the manifest is loadable or that the
      # paths it names were emitted. That is a separate gate.
      - name: Validate manifest and artifacts
        run: npm run validate:manifest

      - name: Package for the Chrome Web Store
        run: npm run package

      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: snap-ocr-extension
          path: snap-ocr-*.zip
          retention-days: 30
          if-no-files-found: error

  e2e:
    name: End-to-end (real Chromium)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # E2E runs against the built artifact, not the sources. These tests run
      # real OCR with the bundled English model and need no network: every
      # language-download case is simulated by request interception.
      - name: Build extension
        run: npm run build

      # test:e2e prepares dist-e2e/ (see scripts/prepare-e2e.mjs) first. xvfb
      # keeps the MV3 service worker reliable on a headless runner.
      - name: Run end-to-end tests
        run: xvfb-run --auto-servernum npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Covers the toolchain and the shipped OCR engine packages alike. High
      # and critical advisories block the merge.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Report all advisories
        if: always()
        run: npm audit || true
